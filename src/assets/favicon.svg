<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b9fe0"/>
      <stop offset="1" stop-color="#0b4f8a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#pool)"/>
  <!-- lane ropes: the swimlanes -->
  <g stroke="#bfe6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 7" opacity="0.85">
    <line x1="9" y1="23" x2="55" y2="23"/>
    <line x1="9" y1="41" x2="55" y2="41"/>
  </g>
  <!-- the flow: a wave crossing the lanes, ending in an arrow -->
  <path d="M10 14 C 26 14, 20 32, 32 32 S 38 50, 46 50" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M43 42 L 55 50 L 43 58 Z" fill="#ffd23f" stroke="#ffd23f" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="10" cy="14" r="5" fill="#ffd23f"/>
</svg>
